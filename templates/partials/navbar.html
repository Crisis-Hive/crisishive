{% load static %}
<nav class="navbar">
    <a href="{% url 'crisis_feed' %}" class="navbar__brand">
        <span>&#9632;</span> CrisisHive
    </a>
    <div class="navbar__links">
        <a href="{% url 'crisis_feed' %}">Home</a>
        <a href="{% url 'crisis_map' %}">Map</a>
        <a href="{% url 'report_crisis' %}">Report Crisis</a>
    </div>
    <div class="navbar__auth">
        {% if request.user.is_authenticated %}
            <a href="{% url 'profile' %}" class="navbar__user">
                {{ request.user.username }}
                <span class="navbar__role-badge">{{ request.user.role }}</span>
            </a>
            <a href="{% url 'logout' %}" class="navbar__logout">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn-nav">Login</a>
            <a href="{% url 'register' %}" class="btn-nav btn-nav--outline">Register</a>
        {% endif %}
    </div>
    <button class="navbar__burger" id="navBurger">&#9776;</button>
</nav>
